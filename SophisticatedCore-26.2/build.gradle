plugins {
	id 'java-library'
	id 'idea'
	id 'maven-publish'
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
	id 'com.diffplug.spotless' version '7.0.4'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = mod_group_id

base {
	archivesName = mod_id
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
	mavenCentral()
	maven {
		url "https://maven.blamejared.com/"
		content {
			includeGroup "mezz.jei"
		}
	}
	maven {
		url = "https://maven.theillusivec4.top/"
		content {
			includeGroup 'top.theillusivec4.curios'
		}
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
		content {
			includeGroup "dev.emi"
		}
	}
	maven {
		url = "https://maven.shedaniel.me/"
		content {
			includeGroup "dev.architectury"
			includeGroup "me.shedaniel"
			includeGroup "me.shedaniel.cloth"
		}
	}
	maven {
		url = "https://maven.twelveiterations.com/repository/maven-public/"
		content {
			includeGroup "net.blay09.mods"
		}
		metadataSources {
			mavenPom()
			artifact()
			ignoreGradleMetadataRedirection()
		}
	}
	maven {
		url = 'https://maven.wispforest.io/releases'
		content {
			includeGroup "io.wispforest"
			includeGroup "io.wispforest.endec"
		}
	}
	maven {
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		url "https://maven.ftb.dev/releases"
		content {
			includeGroup "dev.ftb.mods"
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/sophisticatedcore.accesswidener")

	mods {
		"sophisticatedcore" {
			sourceSet sourceSets.main
		}
	}

	runs {
		configureEach {
			vmArg "-Dfabric.skipMcVersionCheck=true"
		}

		client {
			client()
			setConfigName "Sophisticated Core Client"
		}

		server {
			server()
			setConfigName "Sophisticated Core Server"
		}
	}
}

// 排除没有 26.2 版本的兼容模块（accessories/create/reliquary/curios/chipped）
sourceSets {
	main {
		java {
			exclude 'net/p3pp3rf1y/sophisticatedcore/compat/accessories/**'
			exclude 'net/p3pp3rf1y/sophisticatedcore/compat/create/**'
			exclude 'net/p3pp3rf1y/sophisticatedcore/compat/reliquary/**'
			exclude 'net/p3pp3rf1y/sophisticatedcore/compat/curios/**'
			exclude 'net/p3pp3rf1y/sophisticatedcore/compat/chipped/**'
			exclude 'net/p3pp3rf1y/sophisticatedcore/compat/sawmill/**'
			exclude 'net/p3pp3rf1y/sophisticatedcore/mixin/create/**'
			exclude '**/*.bak'
		}
		resources { exclude '**/*.bak' }
	}
}

// generated resources from data generation
sourceSets.main.resources {
	srcDir 'src/generated/resources'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// MC 26.2 是非混淆版本，无需remap，使用标准Gradle配置替代mod*配置
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JSR-305 for javax.annotation annotations (Nullable, Nonnull, etc.)
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
	// Maven artifact for version comparison (runtime needed for ModInfo/CompatInfo)
	include 'org.apache.maven:maven-artifact:3.9.9'
	implementation 'org.apache.maven:maven-artifact:3.9.9'
	// TypeTools (needed by CreativeCore's bus 7.2.0 EventBus.addListener() to resolve generic types)
	include 'net.jodah:typetools:0.6.3'
	implementation 'net.jodah:typetools:0.6.3'

	// 兼容依赖
	compileOnly "mezz.jei:jei-${jei_mc_version}:${jei_version}"
	// REI compat
	compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
	compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"
	// Architectury API (for dev.architectury.fluid used by REI)
	compileOnly "dev.architectury:architectury-fabric:21.0.4"
	// Cloth Config (for me.shedaniel.math used by REI)
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:26.2.155"
	// Chipped compat (没有 26.2 版本，已排除)
	// compileOnly "curse.maven:chipped-456956:${chipped_cf_file_id}"
	// compileOnly files("../libs/ResourcefulLib-5.0.2.jar")
	// Sawmill compat (没有 26.2 版本，已排除)
	// compileOnly "curse.maven:sawmill-964817:${sawmill_cf_file_id}"
	// EMI compat (没有 26.2 版本源代码，已注释)
	// compileOnly "dev.emi:emi-fabric:${emi_version}"
	// Balm / CraftingTweaks / TrashSlot compat (用户下载的 26.2 版本 jar)
	compileOnly files("../libs/balm-fabric-26.2-26.2.0.3.jar")
	compileOnly files("../libs/craftingtweaks-fabric-26.2-26.2.0.2.jar")
	compileOnly files("../libs/trashslot-fabric-26.2-26.2.0.1.jar")
	// Iris compat (用户下载的 26.2 版本 jar)
	compileOnly files("../libs/iris-fabric-1.11.2+mc26.2.jar")
	// OpenPartiesAndClaims compat (用户下载的 26.2 版本 jar)
	compileOnly files("../libs/open-parties-and-claims-fabric-26.2-0.27.7.jar")
	// ItemBorders compat
	compileOnly "curse.maven:itemborders-513769:${item_borders_cf_file_id}"
	// FTB Chunks compat
	compileOnly "dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}"
	compileOnly "dev.ftb.mods:ftb-library-fabric:${ftb_library_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
	testImplementation 'org.junit.jupiter:junit-jupiter-params:5.13.4'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
	testImplementation "org.mockito:mockito-core:5.20.+"
}

processResources {
	def replaceProperties = [
			minecraft_version   : minecraft_version,
			loader_version      : loader_version,
			mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
			mod_issue_tracker_url: mod_issue_tracker_url, mod_logo_file: mod_logo_file, mod_credits: mod_credits,
			mod_authors         : mod_authors, mod_description: mod_description, mod_display_url: mod_display_url
	]
	inputs.properties replaceProperties
	filesMatching("fabric.mod.json") {
		expand replaceProperties
	}
	exclude '**/*.bak'
}

test {
	enabled = false
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

compileTestJava {
	enabled = false
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}

static def getBuildNumber() {
	if (System.getenv("GITHUB_RUN_NUMBER") != null) {
		return System.getenv("GITHUB_RUN_NUMBER").toString()
	}
	return ""
}
