plugins {
	id 'java-library'
	id 'idea'
	id 'maven-publish'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.diffplug.spotless' version '7.0.4'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = mod_group_id

base {
	archivesName = mod_id
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
	flatDir {
		dirs 'libs'
	}
	mavenCentral()
	maven {
		url "https://maven.blamejared.com/"
		content {
			includeGroup "mezz.jei"
		}
	}
	maven {
		url = "https://maven.theillusivec4.top/"
		content {
			includeGroup 'top.theillusivec4.curios'
		}
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
		content {
			includeGroup "dev.emi"
		}
	}
	maven {
		url = "https://maven.shedaniel.me/"
		content {
			includeGroup "dev.architectury"
			includeGroup "me.shedaniel"
			includeGroup "me.shedaniel.cloth"
		}
	}
	maven {
		url = 'https://maven.wispforest.io/releases'
		content {
			includeGroup "io.wispforest"
			includeGroup "io.wispforest.endec"
		}
	}
	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
}

loom {
	mods {
		"sophisticatedbackpacks" {
			sourceSet sourceSets.main
		}
	}

	accessWidenerPath = file("src/main/resources/sophisticatedbackpacks.accesswidener")

	runs {
		configureEach {
			vmArg "-Dfabric.skipMcVersionCheck=true"
		}

		client {
			client()
			setConfigName "Sophisticated Backpacks Client"
			programArgs "--quickPlaySingleplayer", "testworld"
		}

		server {
			server()
			setConfigName "Sophisticated Backpacks Server"
		}
	}
}

sourceSets {
	main {
		java {
			exclude 'net/p3pp3rf1y/sophisticatedbackpacks/compat/chipped/**'
			exclude 'net/p3pp3rf1y/sophisticatedbackpacks/compat/sawmill/**'
			exclude 'net/p3pp3rf1y/sophisticatedbackpacks/compat/botania/**'
			exclude '**/*.bak'
		}
		resources { exclude '**/*.bak' }
	}
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// MC 26.2 是非混淆版本，使用标准Gradle配置替代mod*配置
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sophisticated Core (bundled into the final jar via include)
	implementation project(':SophisticatedCore-26.2')
	include project(':SophisticatedCore-26.2')

	// JSR-305 for javax.annotation annotations (Nullable, Nonnull, etc.)
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
	// Maven artifact for version comparison (runtime needed for ModInfo/CompatInfo)
	include 'org.apache.maven:maven-artifact:3.9.9'
	implementation 'org.apache.maven:maven-artifact:3.9.9'

	// Recipe viewers - use local JEI jar from libs/
	compileOnly ':jei-26.2-fabric:30.18.0.141'
	runtimeOnly ':jei-26.2-fabric:30.18.0.141'
	// EMI 兼容（没有 26.2 版本源代码，已注释）
	// compileOnly "dev.emi:emi-fabric:${emi_version}"
	compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
	compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"
	// Architectury API (for dev.architectury.fluid used by REI)
	compileOnly "dev.architectury:architectury-fabric:21.0.4"
	// Cloth Config (for me.shedaniel.math used by REI)
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:26.2.155"

	// Trinkets（软依赖）：仅编译期需要 API，运行时缺失则 TrinketsCompat 不启用
	compileOnly ':trinkets:4.1.0-rc.1+26.2'
	runtimeOnly ':trinkets:4.1.0-rc.1+26.2'

	// Curios / Accessories (暂时移除 - maven.theillusivec4.top 不可达)
	// compileOnly "top.theillusivec4.curios:curios-fabric:${curios_version}"
	// compileOnly "io.wispforest:accessories-fabric:${accessories_version}"

	// Balm / CraftingTweaks (暂时移除 - maven.twelveiterations.com 不可达)
	// compileOnly "net.blay09.mods:balm-fabric:${balm_version}"
	// compileOnly "net.blay09.mods:craftingtweaks-fabric:${craftingtweaks_version}"

	// misc compat (没有 26.2 版本，已排除)
	// compileOnly "curse.maven:chipped-456956:${chipped_cf_file_id}"
	// compileOnly "net.blay09.mods:trashslot-fabric:${trashslot_version}"
	// compileOnly "curse.maven:sawmill-964817:${sawmill_cf_file_id}"

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
	testImplementation "org.mockito:mockito-core:5.12.+"
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

processResources {
	def replaceProperties = [
			minecraft_version   : minecraft_version,
			loader_version      : loader_version,
			mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
			mod_issue_tracker_url: mod_issue_tracker_url, mod_logo_file: mod_logo_file, mod_credits: mod_credits,
			mod_authors         : mod_authors, mod_description: mod_description, mod_display_url: mod_display_url,
			sc_version          : sc_version
	]
	inputs.properties replaceProperties
	filesMatching("fabric.mod.json") {
		expand replaceProperties
	}
	exclude '**/*.bak'
}

test {
	enabled = false
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

compileTestJava {
	enabled = false
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}

// 自动复制最新 SophisticatedCore jar 到 libs/ 目录（在 runClient 之前）
tasks.named('runClient') {
	doFirst {
		def coreJar = file("../SophisticatedCore-26.2/build/libs/sophisticatedcore-26.2-1.4.81.jar")
		if (coreJar.exists()) {
			copy {
				from coreJar
				into "libs"
				rename { "sophisticatedcore-26.2.jar" }
			}
			println "Copied latest SophisticatedCore jar to libs/"
		} else {
			println "WARNING: SophisticatedCore jar not found at ${coreJar.absolutePath}"
		}
	}
}

static def getBuildNumber() {
	if (System.getenv("GITHUB_RUN_NUMBER") != null) {
		return System.getenv("GITHUB_RUN_NUMBER").toString()
	}
	return ""
}
